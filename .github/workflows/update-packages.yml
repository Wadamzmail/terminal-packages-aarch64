name: Update termux-packages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Update submodule
        run: |
          set -e

          echo "========================================"
          echo "Initialize termux-packages submodule"
          echo "========================================"

          git submodule sync --recursive
          git submodule update --init --recursive

          if [ ! -d "termux-packages" ]; then
            echo "termux-packages directory does not exist."
            echo "Cloning submodule manually..."

            git clone \
              https://github.com/termux/termux-packages.git \
              termux-packages
          fi

          cd termux-packages

          echo "========================================"
          echo "Update termux-packages"
          echo "========================================"

          git fetch origin

          if git show-ref --verify --quiet refs/remotes/origin/master; then
            git checkout master
            git reset --hard origin/master
          else
            git checkout main
            git reset --hard origin/main
          fi

          cd ..

      - name: Commit and push
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .gitmodules termux-packages

          if ! git diff --cached --quiet; then
            echo "========================================"
            echo "Updating submodule reference"
            echo "========================================"

            git commit -m "Update termux-packages submodule"
            git push
          else
            echo "termux-packages is already up to date."
          fi